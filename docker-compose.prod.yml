# ==========================================================================
# CTS Convênios — PRODUÇÃO
#
# Uso (no servidor, dentro da pasta do projeto):
#   cp .env.production.example .env.production      # e preencha (ver docs/PRODUCAO.md)
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Diferenças para o docker-compose.yml de desenvolvimento: o código vai dentro da imagem
# (sem bind mount), o banco e o Redis não são expostos fora da rede interna, o Redis exige
# senha e há um proxy (Caddy) cuidando do HTTPS.
# ==========================================================================
name: cts_convenios_prod

# Sem isto o Docker guarda os logs de cada container para sempre e, com o tempo, enche o disco do servidor.
# Aqui: no máximo 3 arquivos de 10 MB por container (o suficiente para investigar um problema recente).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  logging: *logging
  build:
    context: .
    dockerfile: docker/prod/Dockerfile
    target: app
  image: cts-convenios-app:prod
  restart: unless-stopped
  env_file: .env.production
  volumes:
    # Documentos enviados pelas prefeituras + logs: precisam sobreviver a uma nova versão.
    - cts_storage:/var/www/html/storage
  networks:
    - cts_network

services:

  # Porta de entrada: HTTPS automático (com domínio) e proxy para o Nginx.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./docker/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - cts_network

  web:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: web
    image: cts-convenios-web:prod
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cts_network

  app:
    <<: *app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Envia os alertas por e-mail (fila Redis). Reinicia a cada hora para não acumular memória.
  queue-worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    pull_policy: never
    depends_on:
      - app

  # Agendador: dispara o Motor de Alertas às 07:00 (Brasília) e a limpeza de tokens.
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    pull_policy: never
    depends_on:
      - app

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cts_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - cts_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - cts_network

networks:
  cts_network:
    driver: bridge

volumes:
  cts_postgres_data:
  cts_redis_data:
  cts_storage:
  caddy_data:
  caddy_config:
