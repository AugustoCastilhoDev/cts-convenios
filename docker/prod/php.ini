; ==========================================================================
; CTS Convênios — PHP em PRODUÇÃO
; ==========================================================================

upload_max_filesize = 20M
post_max_size = 21M
memory_limit = 256M
max_execution_time = 60
max_input_vars = 3000
date.timezone = America/Sao_Paulo

; Nada de detalhes internos para o visitante: erros vão para o log (stderr do container).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; OPcache: o código não muda depois que a imagem é construída, então nunca confere os
; arquivos (mais rápido). Uma versão nova = uma imagem nova = containers recriados.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
