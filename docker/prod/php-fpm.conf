; Ajustes do pool do PHP-FPM em produção.

[www]
; Sem isto o FPM apaga as variáveis de ambiente (APP_KEY, DB_*...) que o compose entrega ao
; container, e o Laravel subiria sem configuração. Em produção não há arquivo .env na imagem.
clear_env = no

; Dimensionado para um servidor pequeno (2 GB de RAM); ajuste conforme o uso real.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recicla cada worker depois de N requisições: segura vazamentos lentos de memória.
pm.max_requests = 500

; Requisições travadas (ex.: geração de PDF enorme) não seguram um worker para sempre.
request_terminate_timeout = 90s
