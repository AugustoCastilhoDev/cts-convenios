# ==========================================================================
# CTS Convênios — Nginx em PRODUÇÃO
# Fica atrás do Caddy (que cuida do HTTPS) e fala com o PHP-FPM do serviço "app".
# ==========================================================================
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Igual ao limite de upload do sistema (20 MB por arquivo) com folga para o corpo da requisição.
    client_max_body_size 21M;

    # Arquivos gerados pelo Vite têm o hash no nome: podem ficar no cache do navegador para sempre.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Só o index.php é executado: nenhum outro .php de public/ vira porta de entrada.
        try_files /index.php =404;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 90;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
