; ==========================================================================
; CTS Convênios — Ajustes de PHP para desenvolvimento local
; ==========================================================================

upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 512M
max_execution_time = 120
max_input_vars = 5000

; ---- Timezone padrão para dados de vigência/prazos ----
date.timezone = America/Sao_Paulo

; ---- OPcache (ajustado para hot-reload em DEV; endurecer em produção) ----
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; ---- Exibição de erros (DEV apenas — desativar em produção) ----
display_errors = On
error_reporting = E_ALL
